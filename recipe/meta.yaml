{% set name = "hvplot" %}
{% set version = "0.13.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/hvplot-{{ version }}.tar.gz
  sha256: e10457d215da484283e5cbf92b0d4655fde4efb04700785984de593f7e679885

build:
  number: 0
  skip: true  # [py<311]
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python
    - pip
    - hatchling >=1.25.0
    - hatch-vcs >=0.4.0
  run:
    - python
    - bokeh >=3.1
    - colorcet >=2
    - holoviews >=1.19.0
    - numpy >=1.21
    - packaging
    - pandas >=1.3
    - panel >=1.0
    - param >=1.12.0,<3.0
  run_constrained:
    - fugue-sql-antlr >=0.2.4
    - geoviews >=1.9.0
    - spatialpandas >=0.4.3

test:
  imports:
    - hvplot
    - hvplot.pandas
    - hvplot.xarray
    - hvplot.dask
    - hvplot.networkx
  commands:
    - pip check
  requires:
    - pip
    - xarray
    - dask
    - networkx

about:
  home: https://hvplot.holoviz.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: A high-level plotting API for the PyData ecosystem built on HoloViews
  description: |
    A high-level plotting API for pandas, dask, xarray, and networkx built on HoloViews
  dev_url: https://github.com/holoviz/hvplot
  doc_url: https://hvplot.holoviz.org

extra:
  recipe-maintainers:
    - CurtLH
    - jbednar
    - ocefpaf
    - philippjfr
    - maximlt
  skip-lints:
    - python_build_tool_in_run
    - host_section_needs_exact_pinnings
